<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #111827; }
    .label { font: 600 22px Arial, sans-serif; fill: #111827; }
    .small { font: 400 18px Arial, sans-serif; fill: #374151; }
    .box { fill: #ffffff; stroke: #374151; stroke-width: 2; rx: 18; }
    .accent { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; rx: 18; }
    .line { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <text x="600" y="55" text-anchor="middle" class="title">History- and Resource-Adaptive Dynamic Risk Prediction</text>

  <rect x="350" y="90" width="500" height="90" class="box"/>
  <text x="600" y="128" text-anchor="middle" class="label">Irregular clinical assessments</text>
  <text x="600" y="158" text-anchor="middle" class="small">ADAS13 · MMSE · Global CDR · CDRSB · FAQ</text>

  <path d="M600 180 L600 225" class="line"/>

  <rect x="350" y="225" width="500" height="90" class="box"/>
  <text x="600" y="263" text-anchor="middle" class="label">Leakage-safe dynamic landmark history</text>
  <text x="600" y="293" text-anchor="middle" class="small">Only information available on or before the current assessment date</text>

  <path d="M600 315 L600 360" class="line"/>

  <rect x="410" y="360" width="380" height="70" class="accent"/>
  <text x="600" y="403" text-anchor="middle" class="label">History-depth hard router</text>

  <path d="M505 430 L310 485" class="line"/>
  <path d="M695 430 L890 485" class="line"/>

  <rect x="90" y="485" width="430" height="90" class="box"/>
  <text x="305" y="523" text-anchor="middle" class="label">One assessment date</text>
  <text x="305" y="553" text-anchor="middle" class="small">Regularized Snapshot survival expert</text>

  <rect x="680" y="485" width="430" height="90" class="box"/>
  <text x="895" y="523" text-anchor="middle" class="label">Two or more assessment dates</text>
  <text x="895" y="553" text-anchor="middle" class="small">Modular latest-anchored Transformer</text>

  <path d="M305 575 L505 615" class="line"/>
  <path d="M895 575 L695 615" class="line"/>

  <rect x="410" y="590" width="380" height="55" class="accent"/>
  <text x="600" y="625" text-anchor="middle" class="label">1-, 2-, 3-, and 5-year cumulative risk</text>
</svg>
